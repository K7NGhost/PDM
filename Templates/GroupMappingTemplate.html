<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Group Mapping Report</title>
    <style>
        body {
            background: white;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #eee;
        }
    </style>
</head>
<body>
    <h1>Group ID to Model Mapping</h1>
    <table>
        <thead>
            <tr>
                <th>Group ID</th>
                <th>Brand</th>
                <th>Models</th>
            </tr>
        </thead>
        <tbody>
            {{rows}}
        </tbody>
    </table>
</body>
</html>
